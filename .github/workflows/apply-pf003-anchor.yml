name: Apply PF-003 anchored availability patch

on:
  push:
    branches:
      - fix/pf-003-anchored-availability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch anchored requested-time semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/integrations/cliniccard/clinicCardAvailabilityExecutor.ts')
          s = p.read_text()

          old = '''    const timezone = config.timezone || context.timezone || "Europe/Prague";\n\n    if (getIsoWeekday(requestedDate) === null) {'''
          new = '''    const timezone = config.timezone || context.timezone || "Europe/Prague";\n    // requested_time is an anchor, not a one-slot query. A single availability read\n    // answers whether the anchor itself is free and also returns nearby future options.\n    const requestedTime = parseHHMM(context.requested_time);\n\n    if (getIsoWeekday(requestedDate) === null) {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        data: {\n          slots: [],\n          timezone,\n          total_slots: 0,\n          free_slots_count: 0,\n        },'''
          new = '''        data: {\n          slots: [],\n          timezone,\n          total_slots: 0,\n          free_slots_count: 0,\n          ...(requestedTime !== null ? {\n            requested_time: requestedTime,\n            requested_time_available: false,\n            requested_time_status: "unavailable",\n          } : {}),\n        },'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    // Filter free slots to at/after requested_time if it is a parseable HH:MM value.\n    const requestedTime = parseHHMM(context.requested_time);\n    let freeSlots = result.data.slots;\n    if (requestedTime !== null) {\n      freeSlots = freeSlots.filter((s) => s.time_start >= requestedTime);\n    }\n    const countAfterTimeFilter = freeSlots.length;'''
          new = '''    // requested_time is an anchor: keep the requested slot if free and include the\n    // next free slots in the same result. The model must not need another lookup merely\n    // because the exact anchor is occupied.\n    let freeSlots = result.data.slots;\n    if (requestedTime !== null) {\n      freeSlots = freeSlots.filter((s) => s.time_start >= requestedTime);\n    }\n    const countAfterTimeFilter = freeSlots.length;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    const countAfterPastFilter = freeSlots.length;\n\n    // Map to output format.'''
          new = '''    const countAfterPastFilter = freeSlots.length;\n    const requestedTimeAvailable = requestedTime !== null\n      ? freeSlots.some((s) => s.time_start === requestedTime)\n      : null;\n\n    // Map to output format.'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      data: {\n        slots: limitedSlots,\n        timezone,\n        total_slots,\n        free_slots_count,\n      },'''
          new = '''      data: {\n        slots: limitedSlots,\n        timezone,\n        total_slots,\n        free_slots_count,\n        ...(requestedTime !== null ? {\n          requested_time: requestedTime,\n          requested_time_available: requestedTimeAvailable,\n          requested_time_status: requestedTimeAvailable ? "available" : "unavailable",\n        } : {}),\n      },'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/runtime/openaiRuntimeAgent.ts')
          s = p.read_text()
          old = '''  "availability.check": {\n    description: "Use for checking available appointment slots.",\n    required_args: ["requested_date"],\n    optional_args: ["requested_time", "service_interest", "limit"],\n  },'''
          new = '''  "availability.check": {\n    description: "Use for checking available appointment slots. When the patient asks about a specific time, pass it as requested_time once. The result explicitly reports requested_time_available and returns that slot when free plus the next available slots at/after it. If requested_time_available=false and slots are returned, offer those slots as alternatives instead of calling availability.check again only to search nearby times.",\n    required_args: ["requested_date"],\n    optional_args: ["requested_time", "service_interest", "limit"],\n  },'''
          count = s.count(old)
          assert count >= 1
          s = s.replace(old, new)

          marker = '    "3. BOOKING SEQUENCE: availability.check → patient affirmatively chooses one offered slot → booking.select_slot → booking.apply. booking.select_slot is mandatory before booking.apply. After slot_conflict: do NOT restart intake. Retain name and service from the current conversation. Ask only for a new time.",'
          assert marker in s
          extra = marker + '''\n    "3a. EXACT-TIME AVAILABILITY: when the patient asks about a specific time (for example 14:00), call availability.check once with requested_time. If requested_time_available=false and the same result contains later slots, say the requested time is unavailable and offer those returned alternatives. Do NOT call availability.check again merely to search 15:00, 16:00, or other nearby times already covered by that result.",'''
          s = s.replace(marker, extra, 1)
          p.write_text(s)
          PY

      - name: Commit exact patch and self-remove
        run: |
          rm .github/workflows/apply-pf003-anchor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/integrations/cliniccard/clinicCardAvailabilityExecutor.ts src/runtime/openaiRuntimeAgent.ts .github/workflows/apply-pf003-anchor.yml
          git diff --cached --check
          git commit -m "fix(PF-003): return anchor availability with alternatives"
          git push origin HEAD:fix/pf-003-anchored-availability
