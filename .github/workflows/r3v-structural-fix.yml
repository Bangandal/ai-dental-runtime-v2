name: R3v structural ownership fix

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/r3v-bounded-model-tool-iterator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded ownership migration
        run: python .github/scripts/r3v_structural_fix.py
      - name: Commit ownership locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r3iBookingApplyExecutionPreparation.test.ts tests/r3lRuntimeToolRequestExecution.test.ts tests/r3qBoundedToolBatchLoop.test.ts tests/r3rSecondBatchKernelOwnership.test.ts tests/r3tRuntimeModelIteration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(R3v): migrate structural ownership locks to iterator graph"
          git push
