name: Apply PF-004b R6 test patch

on:
  push:
    branches:
      - fix/pf-004b-round-independent-select-slot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Flip round-2 regression to round-independent behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/slotEvidenceBinding.test.ts')
          s = p.read_text()

          start_marker = '// ── R-6: round-2 booking.select_slot + booking.apply → both blocked ───────────'
          end_marker = '// ── S: same-round booking.select_slot + booking.apply → Guard S ──────────────'
          start = s.index(start_marker)
          end = s.index(end_marker, start)

          replacement = '''// ── R-6: round-2 booking.select_slot + booking.apply is round-independent ─────\n\n// R-6: A valid slot choice must have identical business legality regardless of which\n// model-call round emitted it. Round-1 availability establishes evidence; round-2\n// select_slot installs fresh proof; matching booking.apply then reaches the executor.\ntest("R-6: round-2 booking.select_slot plus booking.apply — valid selection authorizes booking, executor call count=1", async () => {\n  let executorCallCount = 0;\n  const loop = createRuntimeAgentLoop({\n    model: "test-model",\n    now: new Date("2028-01-14T20:00:00Z"),\n    caller: (async (input) => {\n      const results = input.input.tool_results ?? [];\n      if (!results.length && input.input.tool_definitions) {\n        return {\n          type: "tool_requests" as const,\n          tool_requests: [{ tool: "availability.check", call_id: "ac_r6", arguments: { requested_date: "2028-01-15", requested_time: null } }],\n        };\n      }\n      if (results.some((r: { tool: string }) => r.tool === "availability.check")) {\n        return {\n          type: "tool_requests" as const,\n          tool_requests: [\n            { tool: "booking.select_slot", call_id: "ss_r6", arguments: { subject_id: "subject_1", requested_date: "2028-01-15", requested_time: "10:00" } },\n            { tool: "booking.apply", call_id: "ba_r6", arguments: { subject_id: "subject_1", first_name: "Ivan", last_name: "Petrov", service: "чистка", requested_date: "2028-01-15", requested_time: "10:00" } },\n          ],\n        };\n      }\n      return { type: "final_response" as const, final_response: { final_patient_reply: "Готово." } };\n    }) as RuntimeAgentCaller,\n    executors: {\n      "availability.check": async () => ({ status: "success" as const, data: { slots: [{ starts_at: "2028-01-15T10:00:00" }] } }),\n      "booking.apply": async () => {\n        executorCallCount++;\n        return { status: "success" as const, data: { booking_status: "visit_created", created_visit: true, may_claim_booked: true } };\n      },\n    },\n    bookingProcessStateRepository: makeSlotStateRepo("2028-01-15T10:00:00", "subject_1"),\n  });\n\n  const result = await loop.runTurn({\n    clinic_id: "clinic_1", contact_id: "contact_r6", case_id: null,\n    user_message: "запиши", locale: "ru", trace_id: "tr_r6",\n    channel_contact: { phone_number: "+420111000000", phone_source: "telegram_contact_button" },\n  });\n\n  assert.equal(executorCallCount, 1, "R-6: booking executor must be called exactly once");\n  const ssResult = result.tool_results.find((r) => r.tool === "booking.select_slot");\n  assert.ok(ssResult, "R-6: select_slot result must be present");\n  assert.equal(ssResult!.status, "success", "R-6: valid round-2 select_slot must succeed");\n  const baResult = result.tool_results.find((r) => r.tool === "booking.apply");\n  assert.ok(baResult, "R-6: booking.apply result must be present");\n  assert.equal((baResult!.data as Record<string, unknown>)?.booking_status, "visit_created", "R-6: matching booking.apply must execute");\n});\n\n'''
          s = s[:start] + replacement + s[end:]
          assert 'select_slot_not_allowed_in_round2' not in s
          p.write_text(s)
          PY

      - name: Commit exact test patch and self-remove
        run: |
          rm .github/workflows/apply-pf004b-r6-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/slotEvidenceBinding.test.ts .github/workflows/apply-pf004b-r6-test.yml
          git diff --cached --check
          git commit -m "test(PF-004b): allow round-2 slot selection before booking"
          git push origin HEAD:fix/pf-004b-round-independent-select-slot
