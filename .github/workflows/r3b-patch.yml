name: R3b exact patch

on:
  push:
    branches:
      - refactor/r3b-select-slot-single-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/r3b-select-slot-single-contract
      - name: Apply exact single-contract cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/runtime/openaiRuntimeAgent.ts",
              '''  "booking.select_slot": {
            description: "Confirm the patient's slot choice against active availability evidence. Call this with the exact date and time the patient affirmatively selected. Returns selection_status='selected' when the slot is in active evidence, or a failure reason otherwise. Does NOT create a visit or call ClinicCard. Call booking.apply only after this tool returns selection_status='selected'. subject_id is always required: use 'subject_1' for the sender/self, 'subject_2' for the first mentioned person, etc.",
            required_args: ["subject_id", "requested_date", "requested_time"],
            optional_args: [],
            param_schemas: {
              subject_id: {
                type: "string",
                enum: ["subject_1", "subject_2", "subject_3", "subject_4"],
                description: "use 'subject_1' for the sender/self, 'subject_2' for the first mentioned person, etc.",
              },
            },
          },
''',
              '''  "booking.select_slot": {
            description: "Confirm the active patient's slot choice against active availability evidence. Call this with the exact date and time the patient affirmatively selected. Returns selection_status='selected' when the slot is in active evidence, or a failure reason otherwise. Does NOT create a visit or call ClinicCard. The runtime binds the selection to the active patient; do not provide an internal patient/subject identifier. Call booking.apply only after this tool returns selection_status='selected'.",
            required_args: ["requested_date", "requested_time"],
            optional_args: [],
          },
''',
          )

          replace_once(
              "src/runtime/openaiRuntimeAgentCaller.ts",
              '''const SELECT_SLOT_MODEL_DESCRIPTION =
            "Confirm the active patient's slot choice against active availability evidence. Call this with the exact date and time the patient affirmatively selected. Returns selection_status='selected' when the slot is in active evidence, or a failure reason otherwise. Does NOT create a visit or call ClinicCard. The runtime binds the selection to the active patient; do not provide an internal patient/subject identifier. Call booking.apply only after this tool returns selection_status='selected'.";

''',
              '',
          )

          replace_once(
              "src/runtime/openaiRuntimeAgentCaller.ts",
              '''    // R3a: subject_id remains an internal compatibility field for the deterministic
            // booking kernel, but is no longer part of the OpenAI-facing select-slot contract.
            // The adapter injects the runtime-owned active subject when normalizing the tool call.
            const requiredArgs = toolName === "booking.select_slot"
              ? def.required_args.filter((arg) => arg !== "subject_id")
              : [...def.required_args];
            const optionalArgs = toolName === "booking.select_slot"
              ? def.optional_args.filter((arg) => arg !== "subject_id")
              : [...def.optional_args];
            const description = toolName === "booking.select_slot"
              ? SELECT_SLOT_MODEL_DESCRIPTION
              : def.description;

            return [{
              type: "function",
              name: INTERNAL_TO_OPENAI_TOOL_NAME[toolName],
              description,
              parameters: {
                type: "object",
                properties: buildParameterProperties(
                  requiredArgs,
                  optionalArgs,
                  (def as { param_schemas?: Record<string, Record<string, unknown>> }).param_schemas,
                ),
                required: requiredArgs,
                additionalProperties: true,
              },
            }];
''',
              '''    return [{
              type: "function",
              name: INTERNAL_TO_OPENAI_TOOL_NAME[toolName],
              description: def.description,
              parameters: {
                type: "object",
                properties: buildParameterProperties(
                  def.required_args,
                  def.optional_args,
                  (def as { param_schemas?: Record<string, Record<string, unknown>> }).param_schemas,
                ),
                required: [...def.required_args],
                additionalProperties: true,
              },
            }];
''',
          )

          Path(".github/workflows/r3b-patch.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(R3b): make select-slot contract canonical"
          git push origin HEAD:refactor/r3b-select-slot-single-contract
