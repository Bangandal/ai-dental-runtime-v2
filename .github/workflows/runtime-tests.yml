name: R3g one-shot canonical prompt migration

on:
  push:
    branches:
      - refactor/r3g-canonical-semantic-people-prompt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r3g-prompt-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/r3g-canonical-semantic-people-prompt

      - name: Apply deterministic prompt migration
        run: python3 scripts/r3g-apply.py

      - name: Commit migrated prompt and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(R3g): make semantic people prompt canonical"
          git push origin HEAD:refactor/r3g-canonical-semantic-people-prompt
