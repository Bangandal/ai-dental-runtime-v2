name: Runtime tests

on:
  pull_request:
  push:
    branches:
      - ai-dental-frontdesk-core
      - refactor/r3g-canonical-semantic-people-prompt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-shot R3g final-response contract fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/r3g-canonical-semantic-people-prompt'
        shell: bash
        run: |
          python scripts/r3g-final-response-contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/openaiRuntimeAgent.ts .github/workflows/runtime-tests.yml scripts/r3g-final-response-contract.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(R3g): keep person intents in final_response contract"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-output
          path: test-output.txt
          if-no-files-found: error
