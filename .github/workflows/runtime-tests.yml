name: Runtime tests

on:
  pull_request:
  push:
    branches:
      - ai-dental-frontdesk-core
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply residual PF-011 fixture migration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ ! -f .github/pf011-residual.diff.gz.b64 ]; then
            exit 0
          fi
          base64 -d .github/pf011-residual.diff.gz.b64 | gzip -d > /tmp/pf011-residual.diff
          patch --dry-run -p1 < /tmp/pf011-residual.diff
          patch -p1 < /tmp/pf011-residual.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/anchoredAvailabilityWindow.test.ts \
            tests/bookingApplyActivation.test.ts \
            tests/bookingApplyExecutor.test.ts \
            tests/bookingApplyPhoneOwnership.test.ts \
            tests/bookingAvailabilityPolicyRevalidation.test.ts \
            tests/bookingSlotMutex.test.ts \
            tests/clinicCardAvailabilityExecutor.test.ts \
            tests/clinicCardFieldMapping.test.ts \
            tests/reliabilityGolden.test.ts \
            tests/staleOfferBookingRevalidation.test.ts
          git rm -- .github/pf011-residual.diff.gz.b64
          git commit -m "test(PF-011): migrate remaining fixtures to service authority"
          git push origin HEAD:${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-output
          path: test-output.txt
          if-no-files-found: error

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-source-snapshot
          path: |
            package.json
            package-lock.json
            tsconfig.json
            src
            tests
          if-no-files-found: error
