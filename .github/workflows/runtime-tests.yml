name: R2e one-shot loop migration

on:
  push:
    branches:
      - refactor/r2e-booking-apply-preflight-orchestrator
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r2e-loop-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/r2e-booking-apply-preflight-orchestrator

      - name: Apply deterministic loop migration
        run: python3 scripts/r2e-apply.py

      - name: Commit migrated loop and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(R2e): route booking preflight through decision boundary"
          git push origin HEAD:refactor/r2e-booking-apply-preflight-orchestrator
