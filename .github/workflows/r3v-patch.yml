name: R3v bounded iterator patch

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/r3v-bounded-model-tool-iterator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded bounded-iterator migration
        run: python .github/scripts/r3v_apply.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/runtimeAgentLoopLegacy.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor(R3v): route runTurn through bounded iterator"
          git push
