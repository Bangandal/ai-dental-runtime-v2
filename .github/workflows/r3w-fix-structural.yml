name: R3w structural lock migration

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/r3w-remove-round-compatibility-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded structural lock migration
        run: python .github/scripts/r3w_fix_structural.py
      - name: Commit structural locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bookingApplyActivation.test.ts tests/r3tRuntimeModelIteration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(R3w): migrate structural ownership locks"
          git push
