name: Repair baseline test suite

on:
  push:
    branches:
      - test/repair-baseline-suite

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact test-only repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          mutex = Path("tests/bookingSlotMutex.test.ts")
          text = mutex.read_text()
          old = 'async findPatientByPhone() { return { ok: true, data: [{ id: 1, name: "x", phone: "y" }] }; },'
          new = 'async findPatientByPhone() { return { ok: true, data: [{ id: 1, name: "Ivan Petrov", phone: "+420777111222" }] }; },'
          assert text.count(old) == 1, f"expected exactly one stale mutex fixture, found {text.count(old)}"
          mutex.write_text(text.replace(old, new, 1))

          wa = Path("tests/whatsappVoice.test.ts")
          text = wa.read_text()
          marker = '\n// VERIFY: runtimeAgentLoop.ts not changed, openaiRuntimeAgent.ts not changed\n'
          assert text.count(marker) == 1, f"expected exactly one PR-only VERIFY marker, found {text.count(marker)}"
          head, tail = text.split(marker, 1)
          assert 'test("VERIFY: core runtime files not modified in this PR"' in tail
          wa.write_text(head.rstrip() + "\n")
          PY

      - name: Commit only repaired tests
        run: |
          rm .github/workflows/repair-baseline-suite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bookingSlotMutex.test.ts tests/whatsappVoice.test.ts .github/workflows/repair-baseline-suite.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- tests/bookingSlotMutex.test.ts tests/whatsappVoice.test.ts
          git commit -m "test: repair baseline suite assumptions"
          git push origin HEAD:test/repair-baseline-suite
