name: R3q protocol migration

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/r3q-bounded-tool-batch-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded protocol and test migration
        run: python .github/scripts/r3q_protocol_test_migration.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/openaiRuntimeAgentCaller.ts tests
          git commit -m "test(R3q): migrate bounded-loop protocol expectations"
          git push origin HEAD:${{ github.head_ref }}
