name: R3w dead finalizer cleanup

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/r3w-remove-round-compatibility-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded dead-finalizer cleanup
        run: python .github/scripts/r3w_apply.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/runtimeAgentLoopLegacy.ts tests/r3mRuntimeModelCall.test.ts tests/r3nModelContext.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor(R3w): remove dead legacy finalizers"
          git push
