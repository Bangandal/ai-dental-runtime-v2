name: R3q source patch

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/r3q-bounded-tool-batch-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python .github/scripts/r3q_apply.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/runtimeAgentLoopLegacy.ts
          git commit -m "refactor(R3q): continue second tool batch in conversation"
          git push origin HEAD:${{ github.head_ref }}
