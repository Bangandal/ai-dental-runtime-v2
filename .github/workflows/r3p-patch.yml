name: R3p source patch

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply R3p patch
        run: python .github/scripts/r3p_apply.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- src/runtime/runtimeAgentLoopLegacy.ts tests/slotEvidenceBinding.test.ts; then
            echo "No source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/runtimeAgentLoopLegacy.ts tests/slotEvidenceBinding.test.ts
          git commit -m "refactor(R3p): make select/apply dependency batch-based"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
