name: R3s source patch

on:
  pull_request:
    branches:
      - ai-dental-frontdesk-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/r3s-first-batch-kernel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded patch
        run: python .github/scripts/r3s_apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/runtimeAgentLoopLegacy.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(R3s): route first tool batch through deterministic kernel"
          git push
