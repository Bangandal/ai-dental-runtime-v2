name: Apply PF-003 prompt trim

on:
  push:
    branches:
      - fix/pf-003-anchored-availability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trim anchored availability prompt contract
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/runtime/openaiRuntimeAgent.ts')
          s = p.read_text()

          old_desc = '    description: "Use for checking available appointment slots. When the patient asks about a specific time, pass it as requested_time once. The result explicitly reports requested_time_available and returns that slot when free plus the next available slots at/after it. If requested_time_available=false and slots are returned, offer those slots as alternatives instead of calling availability.check again only to search nearby times.",'
          new_desc = '    description: "Check appointment slots. For a specific time, pass requested_time once. Result includes requested_time_available and free slots at/after it; if false, offer returned alternatives without another availability.check.",'
          assert old_desc in s
          s = s.replace(old_desc, new_desc)

          old_3a = '    "3a. EXACT-TIME AVAILABILITY: when the patient asks about a specific time (for example 14:00), call availability.check once with requested_time. If requested_time_available=false and the same result contains later slots, say the requested time is unavailable and offer those returned alternatives. Do NOT call availability.check again merely to search 15:00, 16:00, or other nearby times already covered by that result.",\n'
          assert old_3a in s
          s = s.replace(old_3a, '', 1)

          old_rule = '    "- Vague time → check first, list exact slots. Exact time → check first: if that exact time is available, confirm ONLY that time — do NOT list other slots alongside it. List alternatives only when the exact requested time is NOT available.",'
          new_rule = '    "- Vague time: check and list exact slots. Exact time: call availability.check once with requested_time; if available, confirm only it; otherwise offer returned alternatives without another check.",'
          assert old_rule in s
          s = s.replace(old_rule, new_rule, 1)

          p.write_text(s)
          PY

      - name: Commit exact patch and self-remove
        run: |
          rm .github/workflows/apply-pf003-prompt-trim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/runtime/openaiRuntimeAgent.ts .github/workflows/apply-pf003-prompt-trim.yml
          git diff --cached --check
          git commit -m "fix(PF-003): keep exact-time rule compact"
          git push origin HEAD:fix/pf-003-anchored-availability
